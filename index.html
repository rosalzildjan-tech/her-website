<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2a44;
    --butter: #f6d55c;
    --sky: #8ec5e8;
    --paper: #fbfaf7;
    --line: #dfe6ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  h1, h2 { font-family: "Bricolage Grotesque", system-ui, sans-serif; margin: 0; }
  .screen { display: none; min-height: 100vh; padding: 32px 20px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ---------- Password screen ---------- */
  #gate { background: linear-gradient(160deg, var(--sky) 0%, var(--butter) 100%); }
  .gate-box { background: var(--paper); padding: 36px 28px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
  .gate-box h1 { font-size: 1.9rem; margin-bottom: 8px; }
  .gate-box p { margin: 0 0 20px; }
  input[type="password"] {
    width: 100%; padding: 14px; font: inherit; font-size: 1.05rem;
    border: 2px solid var(--line); border-radius: 12px; margin-bottom: 12px;
  }
  input[type="password"]:focus { outline: 3px solid var(--sky); border-color: var(--ink); }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--ink); color: #fff; border: 0; border-radius: 12px; padding: 14px 20px;
  }
  button:hover { background: #33416a; }
  button:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
  #gate-error { color: #b3261e; min-height: 1.4em; margin: 10px 0 0; }

  /* ---------- Dashboard ---------- */
  #dashboard { justify-content: flex-start; }
  .dash { width: 100%; max-width: 640px; }
  .dash h2 { font-size: 2rem; margin-bottom: 6px; }
  .dash > p { margin: 0 0 24px; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
  .tile {
    text-align: left; background: #fff; color: var(--ink);
    border: 2px solid var(--line); border-radius: 16px; padding: 20px;
  }
  .tile:hover { background: #fff; border-color: var(--ink); }
  .tile strong { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 1.25rem; margin-bottom: 4px; }
  .tile span { font-weight: 400; font-size: 0.95rem; }
  .tile.mood   { border-left: 10px solid var(--butter); }
  .tile.convo  { border-left: 10px solid var(--sky); }
  .tile.about  { border-left: 10px solid var(--butter); }
  .tile.act    { border-left: 10px solid var(--sky); }
  .tile.kamusta{ border-left: 10px solid var(--butter); grid-column: 1 / -1; }

  /* ---------- Placeholder pages ---------- */
  .page { width: 100%; max-width: 560px; }
  .page h2 { margin-bottom: 10px; }
  .back { background: transparent; color: var(--ink); border: 2px solid var(--ink); margin-top: 20px; }
  .back:hover { background: var(--butter); }

  /* ---------- Mood Tracker ---------- */
  #mood { transition: background-color 0.3s; }
  .mood-box { width: 100%; max-width: 480px; text-align: center; }
  .mood-photo { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 6px solid var(--paper); background: var(--paper); }
  .mood-emoji { font-size: 5rem; line-height: 220px; width: 220px; height: 220px; border-radius: 50%; background: var(--paper); margin: 0 auto; display: none; }
  .mood-photo-wrap { margin: 18px 0; display: flex; justify-content: center; }
  .mood-value { font-family: "Bricolage Grotesque", sans-serif; font-size: 3rem; margin: 0; }
  input[type="range"] { width: 100%; margin: 14px 0 4px; accent-color: var(--ink); height: 32px; }
  .range-labels { display: flex; justify-content: space-between; font-size: 0.95rem; }
  textarea { width: 100%; font: inherit; padding: 12px; border: 2px solid var(--line); border-radius: 12px; margin: 16px 0 12px; resize: vertical; }
  textarea:focus { outline: 3px solid var(--sky); border-color: var(--ink); }
  .privacy { font-size: 0.9rem; margin: 0 0 14px; }
  .mood-msg { background: var(--paper); border-radius: 16px; padding: 20px; font-size: 1.15rem; margin: 18px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Password screen -->
<section id="gate" class="screen active">
  <div class="gate-box">
    <h1>Hi, you.</h1>
    <p>Type our secret word to come in.</p>
    <input type="password" id="pw" placeholder="Secret word" autocomplete="off">
    <button id="enter" style="width:100%">Open</button>
    <p id="gate-error" role="alert"></p>
  </div>
</section>

<!-- Dashboard -->
<section id="dashboard" class="screen">
  <div class="dash">
    <h2>Welcome in</h2>
    <p>Pick anything. Everything here was made for you.</p>
    <div class="grid">
      <button class="tile mood"    data-go="mood"><strong>Mood Tracker</strong><span>Tell me how today feels.</span></button>
      <button class="tile convo"   data-go="convo"><strong>Convo Stimulus</strong><span>Things we could talk about.</span></button>
      <button class="tile about"   data-go="about"><strong>About me</strong><span>Hobbies, school, and dreams.</span></button>
      <button class="tile act"     data-go="activities"><strong>Activities</strong><span>Cheer-ups and adventures.</span></button>
      <button class="tile kamusta" data-go="kamusta"><strong>Kamusta Ako</strong><span>How I'm doing today.</span></button>
    </div>
  </div>
</section>

<!-- Placeholder pages: we will replace each of these, one by one -->
<section id="mood" class="screen"><div class="mood-box">
  <h2>How are you feeling today?</h2>
  <div class="mood-photo-wrap">
    <img id="mood-photo" class="mood-photo" alt="Me, matching your mood" src="photos/okay.jpg">
    <div id="mood-emoji" class="mood-emoji" aria-hidden="true">🙂</div>
  </div>

  <div id="mood-form">
    <p class="mood-value" id="mood-number">5</p>
    <input type="range" id="mood-slider" min="1" max="10" value="5" aria-label="Mood from 1 (sad) to 10 (happy)">
    <div class="range-labels"><span>Sad</span><span>Happy</span></div>
    <textarea id="mood-note" rows="2" placeholder="Anything you want to add? (optional)"></textarea>
    <p class="privacy" id="mood-privacy"></p>
    <button id="mood-submit" style="width:100%">Save today's mood</button>
    <p id="mood-error" role="alert" style="color:#b3261e;min-height:1.4em"></p>
  </div>

  <div id="mood-result" class="hidden">
    <div class="mood-msg" id="mood-message"></div>
  </div>

  <button class="back" data-go="dashboard">Back to dashboard</button>
</div></section>
<section id="convo" class="screen"><div class="page"><h2>Convo Stimulus</h2><p>Coming soon.</p><button class="back" data-go="dashboard">Back to dashboard</button></div></section>
<section id="about" class="screen"><div class="page"><h2>About me</h2><p>Coming soon.</p><button class="back" data-go="dashboard">Back to dashboard</button></div></section>
<section id="activities" class="screen"><div class="page"><h2>Activities</h2><p>Coming soon.</p><button class="back" data-go="dashboard">Back to dashboard</button></div></section>
<section id="kamusta" class="screen"><div class="page"><h2>Kamusta Ako</h2><p>Coming soon.</p><button class="back" data-go="dashboard">Back to dashboard</button></div></section>

<script src="config.js"></script>
<script>
  // Turns text into a scrambled code (SHA-256)
  async function hashText(text) {
    const bytes = new TextEncoder().encode(text.trim().toLowerCase());
    const buffer = await crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  // Shows one screen and hides the others
  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    document.getElementById("mood").style.backgroundColor = id === "mood" ? backgroundFor(Number(slider.value)) : "";
    window.scrollTo(0, 0);
  }

  async function tryPassword() {
    const typed = document.getElementById("pw").value;
    const error = document.getElementById("gate-error");
    if (await hashText(typed) === PASSWORD_HASH) {
      error.textContent = "";
      show("dashboard");
    } else {
      error.textContent = "Not quite. Try again?";
    }
  }

  document.getElementById("enter").addEventListener("click", tryPassword);
  document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryPassword(); });

  // Every button with a data-go attribute takes you to that screen
  document.querySelectorAll("[data-go]").forEach(btn => {
    btn.addEventListener("click", () => show(btn.dataset.go));
  });

  // ---------------- Mood Tracker ----------------
  const slider = document.getElementById("mood-slider");

  // Your photos, from saddest to happiest. Files go in the "photos" folder.
  // The site accepts .jpg, .png, .jpeg or .webp automatically.
  const PHOTO_TYPES = ["jpg", "png", "jpeg", "webp"];
  function photoFor(v) {
    if (v <= 2) return { base: "photos/sad",    emoji: "😢" };
    if (v <= 4) return { base: "photos/down",   emoji: "🙁" };
    if (v <= 6) return { base: "photos/okay",   emoji: "🙂" };
    if (v <= 8) return { base: "photos/happy",  emoji: "😄" };
    return            { base: "photos/joyful", emoji: "🤩" };
  }

  // Background goes blue (sad) -> soft white (middle) -> yellow (happy)
  function backgroundFor(v) {
    const blue = [111, 168, 220], mid = [243, 239, 224], yellow = [246, 213, 92];
    const t = (v - 1) / 9;
    const [a, b, k] = t < 0.5 ? [blue, mid, t * 2] : [mid, yellow, (t - 0.5) * 2];
    return "rgb(" + a.map((c, i) => Math.round(c + (b[i] - c) * k)).join(",") + ")";
  }

  let currentBase = "";
  let photoRun = 0;
  const workingType = {};   // remembers which file type worked for each photo

  function loadPhoto(base, emojiChar) {
    const img = document.getElementById("mood-photo");
    const emoji = document.getElementById("mood-emoji");
    emoji.textContent = emojiChar;
    if (base === currentBase) return;      // same photo as before, nothing to do
    currentBase = base;
    const run = ++photoRun;
    let i = 0;
    const types = workingType[base] ? [workingType[base]] : PHOTO_TYPES;
    function tryNext() {
      if (run !== photoRun) return;        // she moved the slider again, ignore
      if (i >= types.length) { img.style.display = "none"; emoji.style.display = "block"; return; }
      img.src = base + "." + types[i++];
    }
    img.onload = () => {
      if (run !== photoRun) return;
      workingType[base] = img.src.split(".").pop();
      img.style.display = "block"; emoji.style.display = "none";
    };
    img.onerror = tryNext;
    tryNext();
  }

  function updateMoodLook() {
    const v = Number(slider.value);
    document.getElementById("mood-number").textContent = v;
    document.getElementById("mood").style.backgroundColor = backgroundFor(v);
    const p = photoFor(v);
    loadPhoto(p.base, p.emoji);
  }

  // ------------------------------------------------------------
  // MESSAGE BANK. Add or edit messages freely: just keep each one
  // inside quotes and end every line with a comma.
  // Messages are shuffled, and none repeats until she has seen them all.
  // ------------------------------------------------------------
  const MOOD_MESSAGES = {
    // mood 1-2
    sad: [
      "I want to give you a hug so bad, remember na ara lang ko diri :)",
      "Pwede taka updan sa kasubo mo? Sadness is always manageable when shared with someone, tani ako tong someone mo.",
      "I'll be praying for your happiness, there will always be a rainbow after the rain.",
      "Nag hibi ka? Kapoy? Pwede taka updan mag hakwat sina nga mga problema?",
      "I care for you, so does a lot of people. Tani bal'an mo na, ari lang ko diri.",
      "Whatever happened today, you don't have to carry it alone. Ara lang ko diri, okay?",
      "It's okay to not be okay today. Take your time, I'm not going anywhere.",
      "Kapoy gid siguro subong, no? Rest anay. You've been strong for so long, madame.",
      "If you want to rant, I'm all ears. If you want silence, I'll sit with you in it. Your call po.",
      "Sending you the biggest virtual hug I can. Squeeze mo lang, hahah.",
      "You don't have to explain your sadness. I'm just here to remind you that you matter.",
      "This feeling is heavy, but it's not forever. And I'll be around for the whole walk.",
      "Drink some water, take a deep breath, and message me if you want. I'm one text away.",
      "Tomorrow is a new page, but tonight it's okay to just rest. Ara lang ko diri.",
      "You are loved more than you know, and I'm one of the people who thinks so."
    ],
    // mood 3-4
    down: [
      "Wag kana ma-down please, spaghetti lang ang dapat pababa hahah here for you.",
      "Chair up po, pangitai sang bangko dira kag i-itsa para masadyahan ka hahahah sending hugs.",
      "Sad ka today? It's okay mag rest anay, I'll just be here if you need anything.",
      "Ano tawag sa sisig nga wala itlog? Edi sis lang hahah. I know down ka now but I hope things will be better today or maybe tomorrow. Here for you po.",
      "Down today? That's okay, even phones need to recharge. Rest anay, madame.",
      "Why did the cookie go to the doctor? Because it felt crumbly. Same energy today? Feel better soon po hahah.",
      "You don't have to be at your best today. Showing up is already a win.",
      "Small steps lang today. A snack, some water, a little rest. I'm proud of you.",
      "If today is a heavy one, I hope this message makes it a little lighter. Here for you po.",
      "Bad day? It's just a chapter, not the whole book. Ara lang ko diri sa next page.",
      "Wanna talk about it, or want me to distract you with random facts? Either one works hahah.",
      "Be gentle with yourself today, as gentle as you'd be with a friend."
    ],
    // mood 5-6
    okay: [
      "Neutral lang today? Bal'an mo ano mas maka pa happy pagid? spending time with me hahahah one chat away lang ko ah hahah",
      "Okay ka lang? Di kalipat magkaon on time and healthy, para mas maging better pagid day mo.",
      "I hope you know how much I care for you, and I hope knowing this would make your day even better.",
      "Let's make your \"okay\" day a little bit better? ano man? coffee tea or me? hahah here for you po",
      "An okay day is a good blank canvas. Let's see if we can add a little color, ano?",
      "Okay lang is okay. But if you want it to become great, I can send corny jokes hahah.",
      "I hope your day has at least one small thing that made you smile. If not, consider this message that thing hahah.",
      "Hydrate, stretch, and eat something yummy. That's how you upgrade an okay day po.",
      "Neutral today? Plot twist could be coming, stay tuned madame hahah.",
      "Thanks for checking in with me today. That already made my day better.",
      "Okay day? Let's aim for \"pretty good\" by dinner. You got this."
    ],
    // mood 7-8
    happy: [
      "Nice! I'm happy that you are happy po, knowing you feel this way warms my heart.",
      "My day just got a little bit brighter knowing that you are doing well.",
      "Keep up the good work today madame, don't forget to rest and eat well. Here for you!",
      "Gamay nalang gid maging the best na nang imo nga day, always know na ara lang ko diri para sa imo ha, bye",
      "You being happy is my favorite news today po. Keep it going!",
      "Yay! Good days look good on you, madame.",
      "Whatever you did today, keep doing it. It's working hahah.",
      "Happy ka? Then I'm happy too. Simple math hahah.",
      "I hope something small and sweet made you smile today. You deserve all of them.",
      "Proud of you po. Enjoy this feeling, you earned it.",
      "Your good mood is contagious, and I caught it even from here hahah.",
      "Treat yourself a little today, madame. Ice cream maybe? Hint hint hahah."
    ],
    // mood 9-10
    joyful: [
      "knock knock, who's there? happiness. Happiness who? It's you being happy, keep shining po madame",
      "I'm really happy to know that you are happy! Keep shining!",
      "Having the best day? I'll pray day like this would follow you for a very long time :)",
      "I'll be there in your sad moments, and I'm also here for days like this! Glad to know na happy ka subong madame, I hope I am one of the reasons hahah.",
      "A 9 or 10?! Someone call the news, breaking: madame is having a great day hahah.",
      "This is the energy! Hold on to it as long as you can, and share some with me please hahah.",
      "I'm so happy for you I could do a little dance right now. Don't ask for proof hahah.",
      "You deserve days like this and many more. Keep glowing po!",
      "Joyful day alert! Celebrate it however you want, and tell me all about it later.",
      "Your happiness makes my whole day. Thank you for sharing it with me.",
      "If happiness had a face today, it would be yours, madame.",
      "Let's save this day in our memory. A really good one."
    ]
  };

  // Picks a message from the right group without repeating until all are used
  function messageFor(v) {
    const group = v <= 2 ? "sad" : v <= 4 ? "down" : v <= 6 ? "okay" : v <= 8 ? "happy" : "joyful";
    const list = MOOD_MESSAGES[group];
    let bag = [];
    try { bag = JSON.parse(localStorage.getItem("bag_" + group) || "[]"); } catch (e) {}
    bag = bag.filter(i => i < list.length);
    if (bag.length === 0) {
      bag = list.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {      // shuffle
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
    }
    const pick = bag.pop();
    localStorage.setItem("bag_" + group, JSON.stringify(bag));
    return list[pick];
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function showMoodResult(v, message) {
    document.getElementById("mood-form").classList.add("hidden");
    document.getElementById("mood-result").classList.remove("hidden");
    document.getElementById("mood-message").textContent = message;
    slider.value = v;
    updateMoodLook();
  }

  // Runs whenever she opens the Mood Tracker
  function openMood() {
    document.getElementById("mood-privacy").textContent =
      "Heads up: your answer goes to " + YOUR_NAME + ", who just wants to know how your day is going.";
    const saved = JSON.parse(localStorage.getItem("moodToday") || "null");
    if (saved && saved.day === todayKey()) {
      showMoodResult(saved.value, saved.message);   // already did it today
    } else {
      document.getElementById("mood-form").classList.remove("hidden");
      document.getElementById("mood-result").classList.add("hidden");
      updateMoodLook();
    }
  }

  async function submitMood() {
    const button = document.getElementById("mood-submit");
    const error = document.getElementById("mood-error");
    const v = Number(slider.value);
    button.disabled = true;
    button.textContent = "Saving...";
    error.textContent = "";
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ type: "mood", mood: v, note: document.getElementById("mood-note").value })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      const message = messageFor(v);
      localStorage.setItem("moodToday", JSON.stringify({ day: todayKey(), value: v, message: message }));
      showMoodResult(v, message);
    } catch (e) {
      error.textContent = "That didn't save. Check your internet and try again.";
    }
    button.disabled = false;
    button.textContent = "Save today's mood";
  }

  slider.addEventListener("input", updateMoodLook);
  document.getElementById("mood-submit").addEventListener("click", submitMood);
  document.querySelector('[data-go="mood"]').addEventListener("click", openMood);
</script>
</body>
</html>
